name: netscope

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: netscope-db
    environment:
      POSTGRES_USER: netscope
      POSTGRES_PASSWORD: netscope
      POSTGRES_DB: netscope
    # 默认只绑本机回环：避免把数据库暴露到所有网卡（P0-1 安全边界）。
    # 生产部署应删除此 ports 块，或改为反代后的内网地址。
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netscope -d netscope']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    container_name: netscope-app
    # 默认只绑本机回环；需公网访问请前置反向代理 + TLS（P0-1）
    ports: ['127.0.0.1:3000:3000']
    # 注意：.env 里的 DATABASE_URL 指向 localhost（本地开发用），
    # 容器内 localhost 是 app 自己，必须在这里覆盖成服务名 db。
    # environment 的优先级高于 env_file，所以这条会生效。
    environment:
      DATABASE_URL: postgresql://netscope:netscope@db:5432/netscope?schema=public
      APP_BASE_URL: http://localhost:3000
      # 没有 LLM key 时保持 true：研判走规则引擎，功能完整可演示
      LLM_MOCK: ${LLM_MOCK:-true}
      SEED_ON_START: 'true'
      LOG_LEVEL: info
      # —— 安全边界（P0）：production 才强制 API Key，local 放行 ——
      APP_ENV: ${APP_ENV:-local}
      API_KEY: ${API_KEY:-}
      # 多 Key + RBAC：JSON 数组字符串，留空则退回上面的单 API_KEY（ADMIN + default 租户）
      API_KEYS: ${API_KEYS:-}
    env_file: [.env]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
